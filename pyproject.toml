[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcelord"
version = "2.0.0"
description = "Free voice-to-Excel copilot: speak a request, preview the change, apply it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
xcelord = "xcelord.__main__:main"

[tool.setuptools.packages.find]
include = ["xcelord*"]

[tool.setuptools.package-data]
xcelord = ["static/**/*", "samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
